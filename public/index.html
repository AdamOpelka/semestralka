<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Cestovní kancelář</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav class="bg-blue-800 p-4 text-white flex justify-between items-center z-10 shadow-md">
        <h1 class="text-xl font-bold">Naše CK</h1>
        <a href="/admin.html" class="hover:underline">Administrace</a>
    </nav>
    
    <div class="flex flex-1 overflow-hidden">
        <div class="hidden lg:block w-1/6 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');"></div>
        
        <main class="flex-1 p-6 overflow-y-auto">
            <h2 class="text-4xl font-extrabold text-center text-gray-800 mt-6 mb-10 tracking-wide">Naše aktuální zájezdy</h2>
            <div id="tours" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
        </main>

        <div class="hidden lg:block w-1/6 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1499793983690-e29da59ef1c2');"></div>
    </div>

    <!-- Rezervační modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-lg w-full max-w-md">
            <h2 class="text-xl font-bold mb-4">Rezervace zájezdu</h2>
            <input type="hidden" id="r_tourName"><input type="hidden" id="r_country"><input type="hidden" id="r_price">
            <input id="r_fname" class="w-full border p-2 mb-2 rounded" placeholder="Jméno">
            <input id="r_lname" class="w-full border p-2 mb-2 rounded" placeholder="Příjmení">
            <input id="r_email" type="email" class="w-full border p-2 mb-2 rounded" placeholder="E-mail">
            <input id="r_phone" type="tel" class="w-full border p-2 mb-4 rounded" placeholder="+420 123 456 789">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Zrušit</button>
                <button onclick="submitReservation()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Potvrdit</button>
            </div>
        </div>
    </div>

    <script>
        async function load() {
            const res = await fetch('/api/tours');
            const data = await res.json();
            document.getElementById('tours').innerHTML = data.map(t => `
                <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-600">
                    <h3 class="text-xl font-bold">${t.name}</h3>
                    <p class="text-sm text-gray-600 font-semibold mb-2">${t.country} | 📅 ${t.startDate} až ${t.endDate}</p>
                    <p class="text-gray-700 mb-4 h-16 overflow-hidden">${t.description}</p>
                    <div class="flex justify-between items-center mt-4">
                        <span class="text-lg font-bold text-blue-800">${t.price} Kč</span>
                        <button onclick="openModal('${t.name}', '${t.country}', ${t.price})" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Rezervovat</button>
                    </div>
                </div>
            `).join('');
        }

        function openModal(name, country, price) {
            document.getElementById('r_tourName').value = name;
            document.getElementById('r_country').value = country;
            document.getElementById('r_price').value = price;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        async function submitReservation() {
            const resData = {
                tourName: document.getElementById('r_tourName').value,
                country: document.getElementById('r_country').value,
                price: Number(document.getElementById('r_price').value),
                firstName: document.getElementById('r_fname').value,
                lastName: document.getElementById('r_lname').value,
                email: document.getElementById('r_email').value,
                phone: document.getElementById('r_phone').value,
                date: new Date().toISOString()
            };
            if(!resData.firstName || !resData.lastName) return alert('Vyplňte jméno a příjmení.');
            
            await fetch('/api/reservations', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(resData) });
            alert('Rezervace úspěšná!');
            closeModal();
        }
        load();
    </script>
</body>
</html>
