<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Cestovní kancelář</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav class="bg-blue-900 p-4 text-white flex justify-between items-center z-10 shadow-lg">
        <h1 class="text-2xl font-bold tracking-wider">Naše CK</h1>
        <a href="/admin.html" class="bg-blue-700 px-4 py-2 rounded hover:bg-blue-600 transition">Administrace</a>
    </nav>
    
    <div class="flex flex-1 overflow-hidden">
        <div class="hidden lg:block w-1/6 bg-cover bg-center shadow-inner" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');"></div>
        
        <main class="flex-1 p-8 overflow-y-auto bg-gray-100">
            <h2 class="text-4xl font-extrabold text-center text-blue-900 mt-6 mb-8 tracking-wide uppercase drop-shadow-sm">Naše aktuální zájezdy</h2>
            
            <!-- Panel filtrů -->
            <div class="bg-white p-6 rounded-xl shadow-md mb-8 grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Destinace</label>
                    <select id="f_country" onchange="filterTours()" class="w-full border-2 p-2 rounded outline-none focus:border-blue-500"></select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Max cena: <span id="price_val" class="text-blue-600"></span></label>
                    <input type="range" id="f_price" min="0" value="0" oninput="updatePriceLabel(); filterTours()" class="w-full cursor-pointer">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Termín od</label>
                    <input type="date" id="f_dateFrom" onchange="filterTours()" class="w-full border-2 p-2 rounded outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Termín do</label>
                    <input type="date" id="f_dateTo" onchange="filterTours()" class="w-full border-2 p-2 rounded outline-none focus:border-blue-500">
                </div>
            </div>

            <div id="tours" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8"></div>
        </main>

        <div class="hidden lg:block w-1/6 bg-cover bg-center shadow-inner" style="background-image: url('https://images.unsplash.com/photo-1499793983690-e29da59ef1c2');"></div>
    </div>

    <!-- Rezervační modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-2">Rezervace zájezdu</h2>
            <input type="hidden" id="r_tourName"><input type="hidden" id="r_country"><input type="hidden" id="r_price">
            <input id="r_fname" class="w-full border-2 border-gray-200 p-3 mb-3 rounded focus:border-blue-500 outline-none transition" placeholder="Jméno">
            <input id="r_lname" class="w-full border-2 border-gray-200 p-3 mb-3 rounded focus:border-blue-500 outline-none transition" placeholder="Příjmení">
            <input id="r_email" type="email" class="w-full border-2 border-gray-200 p-3 mb-3 rounded focus:border-blue-500 outline-none transition" placeholder="E-mail">
            <input id="r_phone" type="tel" class="w-full border-2 border-gray-200 p-3 mb-6 rounded focus:border-blue-500 outline-none transition" placeholder="+420 123 456 789">
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-2 bg-gray-200 text-gray-800 font-semibold rounded hover:bg-gray-300 transition">Zrušit</button>
                <button onclick="submitReservation()" class="px-5 py-2 bg-blue-600 text-white font-semibold rounded hover:bg-blue-700 transition shadow-md">Potvrdit</button>
            </div>
        </div>
    </div>

    <script>
        let allTours = [];

        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleDateString('cs-CZ');
        };

        function updatePriceLabel() {
            document.getElementById('price_val').innerText = document.getElementById('f_price').value + ' Kč';
        }

        async function load() {
            const res = await fetch('/api/tours');
            allTours = await res.json();
            
            // Naplnění filtru destinací
            const dests = [...new Set(allTours.map(t => t.country))].filter(Boolean).sort();
            document.getElementById('f_country').innerHTML = '<option value="">Všechny destinace</option>' + dests.map(d => `<option value="${d}">${d}</option>`).join('');
            
            // Nastavení maximální ceny pro posuvník
            const maxPrice = allTours.length ? Math.max(...allTours.map(t => Number(t.price) || 0)) : 10000;
            const priceInput = document.getElementById('f_price');
            priceInput.max = maxPrice;
            priceInput.value = maxPrice;
            updatePriceLabel();

            renderTours(allTours);
        }

        function filterTours() {
            const fCountry = document.getElementById('f_country').value;
            const fPrice = Number(document.getElementById('f_price').value);
            const fDateFrom = document.getElementById('f_dateFrom').value;
            const fDateTo = document.getElementById('f_dateTo').value;

            const filtered = allTours.filter(t => {
                let valid = true;
                if (fCountry && t.country !== fCountry) valid = false;
                if (t.price > fPrice) valid = false;
                if (fDateFrom && t.startDate < fDateFrom) valid = false;
                if (fDateTo && t.endDate > fDateTo) valid = false;
                return valid;
            });
            renderTours(filtered);
        }

        function renderTours(data) {
            const container = document.getElementById('tours');
            if(data.length === 0) {
                container.innerHTML = '<p class="text-gray-500 col-span-full text-center py-10">Zadaným kritériím neodpovídá žádný zájezd.</p>';
                return;
            }
            container.innerHTML = data.map(t => `
                <div class="bg-white rounded-xl shadow-lg hover:shadow-2xl transition overflow-hidden border border-gray-100 flex flex-col">
                    ${t.image ? `<img src="${t.image}" class="w-full h-48 object-cover">` : `<div class="w-full h-48 bg-blue-100 flex items-center justify-center text-blue-300"><span class="text-4xl">✈️</span></div>`}
                    <div class="p-6 flex flex-col flex-1">
                        <h3 class="text-2xl font-bold text-gray-800 mb-1">${t.name}</h3>
                        <p class="text-sm text-blue-600 font-bold mb-3 uppercase tracking-wider">${t.country}</p>
                        <p class="text-sm text-gray-500 mb-4 bg-gray-50 p-2 rounded inline-block w-max">📅 ${formatDate(t.startDate)} – ${formatDate(t.endDate)}</p>
                        <p class="text-gray-700 mb-6 flex-1 line-clamp-3">${t.description}</p>
                        <div class="flex justify-between items-center mt-auto border-t pt-4">
                            <span class="text-xl font-black text-gray-900">${t.price} Kč</span>
                            <button onclick="openModal('${t.name}', '${t.country}', ${t.price})" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition shadow-md font-semibold">Rezervovat</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openModal(name, country, price) {
            document.getElementById('r_tourName').value = name;
            document.getElementById('r_country').value = country;
            document.getElementById('r_price').value = price;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        async function submitReservation() {
            const resData = {
                tourName: document.getElementById('r_tourName').value,
                country: document.getElementById('r_country').value,
                price: Number(document.getElementById('r_price').value),
                firstName: document.getElementById('r_fname').value,
                lastName: document.getElementById('r_lname').value,
                email: document.getElementById('r_email').value,
                phone: document.getElementById('r_phone').value,
                date: new Date().toISOString()
            };
            
            if(!resData.firstName || !resData.lastName || !resData.email || !resData.phone) {
                return alert('Vyplňte všechny rezervační údaje.');
            }
            
            await fetch('/api/reservations', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(resData) });
            alert('Rezervace úspěšná!');
            
            ['r_fname', 'r_lname', 'r_email', 'r_phone'].forEach(id => document.getElementById(id).value = '');
            closeModal();
        }

        load();
    </script>
</body>
</html>
