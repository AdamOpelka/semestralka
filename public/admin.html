<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Admin - CK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div id="login" class="max-w-sm mx-auto bg-white p-6 rounded shadow mt-20">
        <h2 class="text-xl font-bold mb-4">Administrace</h2>
        <input id="pwd" type="password" class="w-full border p-2 mb-4" placeholder="Zadejte heslo">
        <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded">Přihlásit</button>
        <button onclick="window.location.href='/'" class="w-full bg-gray-300 text-gray-800 p-2 rounded mt-2 hover:bg-gray-400">Zpět na web</button>
    </div>

    <div id="admin" class="hidden max-w-6xl mx-auto space-y-6">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-3xl font-bold">Správa zájezdů</h1>
            <div class="space-x-2">
                <button onclick="toggleCharts()" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">Grafy</button>
                <button onclick="window.location.reload()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Odhlásit</button>
            </div>
        </div>
        
        <!-- Formulář s datumem a dynamickým našeptávačem zemí -->
        <div class="bg-white p-6 rounded shadow grid grid-cols-1 md:grid-cols-5 gap-4">
            <input id="t_name" class="border p-2 rounded" placeholder="Název zájezdu">
            <input id="t_desc" class="border p-2 rounded" placeholder="Krátký popis">
            <input id="t_price" type="number" class="border p-2 rounded" placeholder="Cena (Kč)">
            <input id="t_date" type="date" class="border p-2 rounded" placeholder="Termín">
            <input list="countries" id="t_country" class="border p-2 rounded" placeholder="Země">
            <datalist id="countries"></datalist>
            <button onclick="createTour()" class="bg-green-600 text-white p-2 rounded md:col-span-5 hover:bg-green-700">Přidat zájezd</button>
        </div>

        <div class="bg-white p-6 rounded shadow overflow-x-auto">
            <table class="w-full text-left">
                <thead class="border-b bg-gray-50"><tr><th class="p-2">Název</th><th>Země</th><th>Termín</th><th>Cena</th><th>Akce</th></tr></thead>
                <tbody id="table"></tbody>
            </table>
        </div>

        <div id="chartsContainer" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8 mt-8">
            <div class="bg-white p-6 rounded shadow"><canvas id="chartCount"></canvas></div>
            <div class="bg-white p-6 rounded shadow"><canvas id="chartValue"></canvas></div>
        </div>
    </div>

    <script>
        let chartCountInstance = null, chartValueInstance = null;

        // Stažení všech zemí z veřejného API a vytvoření našeptávače
        async function loadCountries() {
            const res = await fetch('https://restcountries.com/v3.1/all?fields=translations');
            const data = await res.json();
            const countryNames = data.map(c => c.translations.ces?.common).filter(Boolean).sort();
            document.getElementById('countries').innerHTML = countryNames.map(c => `<option value="${c}">`).join('');
        }
        loadCountries();

        async function login() {
            const pwd = document.getElementById('pwd').value;
            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            });
            if(res.ok) {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('admin').classList.remove('hidden');
                loadData();
            } else {
                alert('Nesprávné heslo');
            }
        }

        function toggleCharts() {
            document.getElementById('chartsContainer').classList.toggle('hidden');
        }

        async function loadData() {
            const [toursRes, resRes] = await Promise.all([fetch('/api/tours'), fetch('/api/reservations')]);
            renderTable(await toursRes.json());
            renderCharts(await resRes.json());
        }

        function renderTable(tours) {
            document.getElementById('table').innerHTML = tours.map(t => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-2">${t.name}</td>
                    <td>${t.country}</td>
                    <td>${t.date}</td>
                    <td>${t.price} Kč</td>
                    <td><button onclick="delTour('${t.id}')" class="text-red-600 font-bold hover:underline">Smazat</button></td>
                </tr>`).join('');
        }

        async function createTour() {
            const data = {
                name: document.getElementById('t_name').value,
                description: document.getElementById('t_desc').value,
                price: document.getElementById('t_price').value,
                date: document.getElementById('t_date').value,
                country: document.getElementById('t_country').value
            };
            if(!data.name || !data.date || !data.country) return alert('Vyplňte název, datum a zemi.');
            await fetch('/api/tours', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
            ['t_name', 't_desc', 't_price', 't_date', 't_country'].forEach(id => document.getElementById(id).value = '');
            loadData();
        }

        async function delTour(id) {
            await fetch(`/api/tours?id=${id}`, { method: 'DELETE' });
            loadData();
        }

        function renderCharts(reservations) {
            const dataMap = {};
            reservations.forEach(r => {
                if(!dataMap[r.country]) dataMap[r.country] = { count: 0, value: 0 };
                dataMap[r.country].count += 1;
                dataMap[r.country].value += Number(r.price);
            });
            const labels = Object.keys(dataMap);
            if(chartCountInstance) chartCountInstance.destroy();
            if(chartValueInstance) chartValueInstance.destroy();

            chartCountInstance = new Chart(document.getElementById('chartCount'), {
                type: 'pie', data: { labels, datasets: [{ label: 'Počet rezervací', data: labels.map(l => dataMap[l].count) }] },
                options: { plugins: { title: { display: true, text: 'Oblíbenost destinací' } } }
            });
            chartValueInstance = new Chart(document.getElementById('chartValue'), {
                type: 'bar', data: { labels, datasets: [{ label: 'Tržby (Kč)', data: labels.map(l => dataMap[l].value), backgroundColor: '#2563eb' }] },
                options: { plugins: { title: { display: true, text: 'Tržby podle destinací' } } }
            });
        }
    </script>
</body>
</html>
