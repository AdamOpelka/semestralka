<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <!-- Přihlašovací obrazovka -->
    <div id="login-screen" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow-xl">
        <h2 class="text-2xl font-bold mb-4 text-center">Přihlášení</h2>
        <input id="pwd" type="password" class="w-full border p-2 rounded mb-4" placeholder="Heslo (heslo123)">
        <button onclick="login()" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700">Vstoupit</button>
    </div>

    <!-- Hlavní administrace (skrytá před loginem) -->
    <div id="admin-content" class="hidden max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Správa úkolů</h1>
            <!-- TLAČÍTKO PRO EXPORT CSV -->
            <button onclick="exportCSV()" class="bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-700 transition font-medium">
                Export do CSV
            </button>
        </div>

        <!-- Formulář pro přidání -->
        <div class="mb-8 p-4 bg-blue-50 rounded-lg border border-blue-100">
            <h3 class="font-bold mb-2 text-blue-800">Nový záznam</h3>
            <div class="flex gap-2">
                <input id="newName" class="flex-1 border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Zadejte název úkolu/zboží">
                <button onclick="create()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">Uložit</button>
            </div>
        </div>

        <!-- Tabulka dat -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b-2 text-gray-600">
                        <th class="py-2 px-4">Název</th>
                        <th class="py-2 px-4">Upravit text</th>
                        <th class="py-2 px-4 text-right">Akce</th>
                    </tr>
                </thead>
                <tbody id="table"></tbody>
            </table>
        </div>
    </div>

    <script>
        let cachedData = [];

        function login() {
            if(document.getElementById('pwd').value === 'heslo123') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                load();
            } else {
                alert('Špatné heslo!');
            }
        }

        async function load() {
            try {
                const res = await fetch('/api/items');
                cachedData = await res.json();
                const table = document.getElementById('table');
                table.innerHTML = cachedData.map(i => `
                    <tr class="border-b hover:bg-gray-50 transition">
                        <td class="py-3 px-4 font-medium text-gray-700">${i.name}</td>
                        <td class="py-3 px-4">
                            <input id="u_${i.id}" value="${i.name}" class="border rounded px-2 py-1 text-sm focus:ring-1 focus:ring-blue-400 outline-none w-full">
                        </td>
                        <td class="py-3 px-4 text-right space-x-3">
                            <button onclick="upd('${i.id}')" class="text-blue-600 hover:text-blue-800 font-medium">Update</button>
                            <button onclick="del('${i.id}')" class="text-red-600 hover:text-red-800 font-medium">Delete</button>
                        </td>
                    </tr>`).join('');
            } catch (err) {
                console.error("Chyba při načítání:", err);
            }
        }

        async function create() {
            const name = document.getElementById('newName').value;
            if(!name) return;
            await fetch('/api/items', { 
                method: 'POST', 
                headers: {'Content-Type':'application/json'}, 
                body: JSON.stringify({ name }) 
            });
            document.getElementById('newName').value = '';
            load();
        }

        async function upd(id) {
            const name = document.getElementById(`u_${id}`).value;
            await fetch('/api/items', { 
                method: 'PUT', 
                headers: {'Content-Type':'application/json'}, 
                body: JSON.stringify({ id, name }) 
            });
            load();
        }

        async function del(id) {
            if(confirm('Opravdu chcete tuto položku smazat?')) {
                await fetch(`/api/items?id=${id}`, { method: 'DELETE' });
                load();
            }
        }

        // FUNKCE PRO EXPORT CSV
        function exportCSV() {
            if (cachedData.length === 0) {
                alert('Žádná data k exportu!');
                return;
            }
            let csv = 'ID,Nazev\n';
            cachedData.forEach(i => { 
                // Odstranění čárek z názvu, aby se nerozbilo CSV
                const cleanName = i.name.replace(/,/g, '');
                csv += `${i.id},${cleanName}\n`; 
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'export_dat.csv');
            a.click();
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
