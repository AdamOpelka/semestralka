<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Admin - CK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div id="login" class="max-w-sm mx-auto bg-white p-6 rounded shadow mt-20">
        <h2 class="text-xl font-bold mb-4">Administrace</h2>
        <input id="pwd" type="password" class="w-full border p-2 mb-4" placeholder="Zadejte heslo">
        <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded">Přihlásit</button>
        <button onclick="window.location.href='/'" class="w-full bg-gray-300 text-gray-800 p-2 rounded mt-2 hover:bg-gray-400">Zpět na web</button>
    </div>

    <div id="admin" class="hidden max-w-6xl mx-auto space-y-6">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-3xl font-bold">Správa zájezdů</h1>
            <div class="space-x-2">
                <button onclick="toggleCharts()" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">Grafy</button>
                <button onclick="window.location.reload()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Odhlásit</button>
            </div>
        </div>
        
        <div class="bg-white p-6 rounded shadow grid grid-cols-1 md:grid-cols-6 gap-4 items-end">
            <div class="md:col-span-2"><label class="text-xs text-gray-500">Název</label><input id="t_name" class="w-full border p-2 rounded"></div>
            <div class="md:col-span-2"><label class="text-xs text-gray-500">Popis</label><input id="t_desc" class="w-full border p-2 rounded"></div>
            <div><label class="text-xs text-gray-500">Cena (Kč)</label><input id="t_price" type="number" class="w-full border p-2 rounded"></div>
            <div><label class="text-xs text-gray-500">Země</label><input list="countries" id="t_country" class="w-full border p-2 rounded"><datalist id="countries"></datalist></div>
            <div class="md:col-span-2"><label class="text-xs text-gray-500">Od (Odjezd)</label><input id="t_startDate" type="date" class="w-full border p-2 rounded"></div>
            <div class="md:col-span-2"><label class="text-xs text-gray-500">Do (Příjezd)</label><input id="t_endDate" type="date" class="w-full border p-2 rounded"></div>
            <div class="md:col-span-2 flex gap-2">
                <button id="submitBtn" onclick="saveTour()" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700">Přidat zájezd</button>
                <button id="cancelEditBtn" onclick="cancelEdit()" class="hidden w-1/3 bg-gray-500 text-white p-2 rounded hover:bg-gray-600">Zrušit</button>
            </div>
        </div>

        <div class="bg-white p-6 rounded shadow overflow-x-auto">
            <table class="w-full text-left">
                <thead class="border-b bg-gray-50"><tr><th class="p-2">Název</th><th>Země</th><th>Od - Do</th><th>Cena</th><th>Akce</th></tr></thead>
                <tbody id="table"></tbody>
            </table>
        </div>

        <div id="chartsContainer" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8 mt-8">
            <div class="bg-white p-6 rounded shadow"><canvas id="chartCount"></canvas></div>
            <div class="bg-white p-6 rounded shadow"><canvas id="chartValue"></canvas></div>
        </div>
    </div>

    <script>
        let chartCountInstance = null, chartValueInstance = null;
        let cachedTours = [];
        let editingId = null;

        async function loadCountries() {
            const res = await fetch('https://restcountries.com/v3.1/all?fields=translations');
            const data = await res.json();
            const countryNames = data.map(c => c.translations.ces?.common).filter(Boolean).sort();
            document.getElementById('countries').innerHTML = countryNames.map(c => `<option value="${c}">`).join('');
        }
        loadCountries();

        async function login() {
            const pwd = document.getElementById('pwd').value;
            const res = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
            if(res.ok) {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('admin').classList.remove('hidden');
                loadData();
            } else { alert('Nesprávné heslo'); }
        }

        function toggleCharts() { document.getElementById('chartsContainer').classList.toggle('hidden'); }

        async function loadData() {
            const [toursRes, resRes] = await Promise.all([fetch('/api/tours'), fetch('/api/reservations')]);
            cachedTours = await toursRes.json();
            renderTable(cachedTours);
            renderCharts(await resRes.json());
        }

        function renderTable(tours) {
            document.getElementById('table').innerHTML = tours.map(t => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-2">${t.name}</td>
                    <td>${t.country}</td>
                    <td>${t.startDate} - ${t.endDate}</td>
                    <td>${t.price} Kč</td>
                    <td class="space-x-2">
                        <button onclick="editTour('${t.id}')" class="text-blue-600 font-bold hover:underline">Upravit</button>
                        <button onclick="delTour('${t.id}')" class="text-red-600 font-bold hover:underline">Smazat</button>
                    </td>
                </tr>`).join('');
        }

        async function saveTour() {
            const data = {
                name: document.getElementById('t_name').value,
                description: document.getElementById('t_desc').value,
                price: document.getElementById('t_price').value,
                startDate: document.getElementById('t_startDate').value,
                endDate: document.getElementById('t_endDate').value,
                country: document.getElementById('t_country').value
            };
            if(!data.name || !data.startDate || !data.endDate || !data.country) return alert('Vyplňte název, obě data a zemi.');
            
            if (editingId) {
                await fetch('/api/tours', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({id: editingId, ...data}) });
            } else {
                await fetch('/api/tours', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
            }
            cancelEdit();
            loadData();
        }

        function editTour(id) {
            const tour = cachedTours.find(t => t.id === id);
            if(!tour) return;
            document.getElementById('t_name').value = tour.name || '';
            document.getElementById('t_desc').value = tour.description || '';
            document.getElementById('t_price').value = tour.price || '';
            document.getElementById('t_startDate').value = tour.startDate || '';
            document.getElementById('t_endDate').value = tour.endDate || '';
            document.getElementById('t_country').value = tour.country || '';
            
            editingId = id;
            document.getElementById('submitBtn').innerText = 'Uložit změny';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
        }

        function cancelEdit() {
            editingId = null;
            ['t_name', 't_desc', 't_price', 't_startDate', 't_endDate', 't_country'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('submitBtn').innerText = 'Přidat zájezd';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        async function delTour(id) {
            if(confirm('Opravdu smazat?')) {
                await fetch(`/api/tours?id=${id}`, { method: 'DELETE' });
                loadData();
            }
        }

        function renderCharts(reservations) {
            const dataMap = {};
            reservations.forEach(r => {
                if(!dataMap[r.country]) dataMap[r.country] = { count: 0, value: 0 };
                dataMap[r.country].count += 1;
                dataMap[r.country].value += Number(r.price);
            });
            const labels = Object.keys(dataMap);
            if(chartCountInstance) chartCountInstance.destroy();
            if(chartValueInstance) chartValueInstance.destroy();

            chartCountInstance = new Chart(document.getElementById('chartCount'), {
                type: 'pie', data: { labels, datasets: [{ label: 'Počet rezervací', data: labels.map(l => dataMap[l].count) }] },
                options: { plugins: { title: { display: true, text: 'Oblíbenost destinací' } } }
            });
            chartValueInstance = new Chart(document.getElementById('chartValue'), {
                type: 'bar', data: { labels, datasets: [{ label: 'Tržby (Kč)', data: labels.map(l => dataMap[l].value), backgroundColor: '#2563eb' }] },
                options: { plugins: { title: { display: true, text: 'Tržby podle destinací' } } }
            });
        }
    </script>
</body>
</html>
