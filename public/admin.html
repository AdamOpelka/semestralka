<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Admin - CK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div id="login" class="max-w-sm mx-auto bg-white p-6 rounded shadow">
        <input id="pwd" type="password" class="w-full border p-2 mb-2" placeholder="Heslo (heslo123)">
        <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded">Přihlásit</button>
    </div>

    <div id="admin" class="hidden max-w-6xl mx-auto space-y-8">
        <h1 class="text-3xl font-bold">Správa zájezdů a statistik</h1>
        
        <!-- Formulář -->
        <div class="bg-white p-6 rounded shadow grid grid-cols-1 md:grid-cols-4 gap-4">
            <input id="t_name" class="border p-2" placeholder="Název zájezdu">
            <input id="t_desc" class="border p-2" placeholder="Krátký popis">
            <input id="t_price" type="number" class="border p-2" placeholder="Cena (Kč)">
            <select id="t_country" class="border p-2">
                <option value="Řecko">Řecko</option>
                <option value="Itálie">Itálie</option>
                <option value="Španělsko">Španělsko</option>
                <option value="Egypt">Egypt</option>
                <option value="Turecko">Turecko</option>
            </select>
            <button onclick="createTour()" class="bg-green-600 text-white p-2 rounded md:col-span-4">Přidat zájezd</button>
        </div>

        <!-- Tabulka -->
        <div class="bg-white p-6 rounded shadow overflow-x-auto">
            <table class="w-full text-left">
                <thead class="border-b bg-gray-50"><tr><th>Název</th><th>Země</th><th>Cena</th><th>Akce</th></tr></thead>
                <tbody id="table"></tbody>
            </table>
        </div>

        <!-- Grafy -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded shadow"><canvas id="chartCount"></canvas></div>
            <div class="bg-white p-6 rounded shadow"><canvas id="chartValue"></canvas></div>
        </div>
    </div>

    <script>
        let chartCountInstance = null;
        let chartValueInstance = null;

        function login() {
            if(document.getElementById('pwd').value === 'heslo123') {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('admin').classList.remove('hidden');
                loadData();
            }
        }

        async function loadData() {
            const [toursRes, resRes] = await Promise.all([fetch('/api/tours'), fetch('/api/reservations')]);
            const tours = await toursRes.json();
            const reservations = await resRes.json();
            renderTable(tours);
            renderCharts(reservations);
        }

        function renderTable(tours) {
            document.getElementById('table').innerHTML = tours.map(t => `
                <tr class="border-b">
                    <td class="py-2">${t.name}</td>
                    <td>${t.country}</td>
                    <td>${t.price} Kč</td>
                    <td><button onclick="delTour('${t.id}')" class="text-red-600">Smazat</button></td>
                </tr>`).join('');
        }

        async function createTour() {
            const data = {
                name: document.getElementById('t_name').value,
                description: document.getElementById('t_desc').value,
                price: document.getElementById('t_price').value,
                country: document.getElementById('t_country').value
            };
            if(!data.name) return;
            await fetch('/api/tours', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
            loadData();
        }

        async function delTour(id) {
            await fetch(`/api/tours?id=${id}`, { method: 'DELETE' });
            loadData();
        }

        function renderCharts(reservations) {
            const dataMap = {};
            reservations.forEach(r => {
                if(!dataMap[r.country]) dataMap[r.country] = { count: 0, value: 0 };
                dataMap[r.country].count += 1;
                dataMap[r.country].value += Number(r.price);
            });

            const labels = Object.keys(dataMap);
            const counts = labels.map(l => dataMap[l].count);
            const values = labels.map(l => dataMap[l].value);

            if(chartCountInstance) chartCountInstance.destroy();
            if(chartValueInstance) chartValueInstance.destroy();

            chartCountInstance = new Chart(document.getElementById('chartCount'), {
                type: 'pie',
                data: { labels, datasets: [{ label: 'Počet rezervací', data: counts }] },
                options: { plugins: { title: { display: true, text: 'Oblíbenost destinací (počet)' } } }
            });

            chartValueInstance = new Chart(document.getElementById('chartValue'), {
                type: 'bar',
                data: { labels, datasets: [{ label: 'Hodnota rezervací (Kč)', data: values, backgroundColor: '#2563eb' }] },
                options: { plugins: { title: { display: true, text: 'Tržby podle destinací' } } }
            });
        }
    </script>
</body>
</html>
