<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Admin - CK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-blue-900 to-gray-900 min-h-screen p-8 text-gray-800">
    <div id="login" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-2xl mt-32 border-t-8 border-blue-500">
        <h2 class="text-3xl font-extrabold mb-6 text-center text-gray-800">Administrace CK</h2>
        <input id="pwd" type="password" class="w-full border-2 border-gray-200 p-3 mb-4 rounded focus:border-blue-500 outline-none transition" placeholder="Zadejte bezpečnostní heslo">
        <button onclick="login()" class="w-full bg-blue-600 text-white font-bold p-3 rounded hover:bg-blue-700 transition shadow-lg">Přihlásit se</button>
        <button onclick="window.location.href='/'" class="w-full bg-gray-100 text-gray-600 font-semibold p-3 rounded mt-3 hover:bg-gray-200 transition">Zpět na web</button>
    </div>

    <div id="admin" class="hidden max-w-7xl mx-auto space-y-8">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-6 rounded-xl shadow-lg border-l-8 border-blue-500">
            <div class="flex gap-4">
                <button onclick="switchView('tours')" class="text-xl font-bold text-gray-800 hover:text-blue-600 transition">Destinace</button>
                <button onclick="switchView('reservations')" class="text-xl font-bold text-gray-800 hover:text-blue-600 transition">Rezervace</button>
            </div>
            <div class="space-x-3">
                <button onclick="exportCSV()" class="bg-green-600 text-white font-semibold px-5 py-2 rounded hover:bg-green-700 shadow transition">⬇ CSV Rezervace</button>
                <button onclick="toggleCharts()" class="bg-purple-600 text-white font-semibold px-5 py-2 rounded hover:bg-purple-700 shadow transition">📊 Grafy</button>
                <button onclick="window.location.reload()" class="bg-red-600 text-white font-semibold px-5 py-2 rounded hover:bg-red-700 shadow transition">🚪 Odhlásit</button>
            </div>
        </div>
        
        <div id="view-tours" class="space-y-8">
            <div class="bg-white p-8 rounded-xl shadow-xl grid grid-cols-1 md:grid-cols-6 gap-5 items-end">
                <h2 class="md:col-span-6 text-xl font-bold border-b pb-2 mb-2 text-gray-700">Tvorba / Úprava zájezdu</h2>
                <div class="md:col-span-2"><label class="text-sm font-semibold text-gray-600">Název</label><input id="t_name" class="w-full border-2 p-2 rounded outline-none focus:border-blue-500"></div>
                <div class="md:col-span-2"><label class="text-sm font-semibold text-gray-600">Popis</label><input id="t_desc" class="w-full border-2 p-2 rounded outline-none focus:border-blue-500"></div>
                <div><label class="text-sm font-semibold text-gray-600">Cena (Kč)</label><input id="t_price" type="number" class="w-full border-2 p-2 rounded outline-none focus:border-blue-500"></div>
                <div><label class="text-sm font-semibold text-gray-600">Země</label><input list="countries" id="t_country" class="w-full border-2 p-2 rounded outline-none focus:border-blue-500"><datalist id="countries"></datalist></div>
                <div class="md:col-span-2"><label class="text-sm font-semibold text-gray-600">Od (Odjezd)</label><input id="t_startDate" type="date" class="w-full border-2 p-2 rounded outline-none focus:border-blue-500"></div>
                <div class="md:col-span-2"><label class="text-sm font-semibold text-gray-600">Do (Příjezd)</label><input id="t_endDate" type="date" class="w-full border-2 p-2 rounded outline-none focus:border-blue-500"></div>
                <div class="md:col-span-2"><label class="text-sm font-semibold text-gray-600">Fotografie (volitelně)</label><input id="t_image" type="file" accept="image/*" class="w-full border-2 p-1.5 rounded text-sm bg-gray-50"></div>
                
                <div class="md:col-span-6 flex gap-3 mt-4">
                    <button id="submitBtn" onclick="saveTour()" class="w-full md:w-auto px-8 bg-blue-600 text-white font-bold p-3 rounded hover:bg-blue-700 shadow-lg transition">Přidat zájezd</button>
                    <button id="cancelEditBtn" onclick="cancelEdit()" class="hidden w-full md:w-auto px-8 bg-gray-500 text-white font-bold p-3 rounded hover:bg-gray-600 shadow-lg transition">Zrušit úpravu</button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-xl mb-6 grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div><label class="block text-sm font-semibold text-gray-600 mb-1">Destinace</label><select id="f_admin_country" onchange="filterAdminTours()" class="w-full border-2 p-2 rounded outline-none focus:border-blue-500"></select></div>
                <div><label class="block text-sm font-semibold text-gray-600 mb-1">Max cena: <span id="admin_price_val" class="text-blue-600"></span></label><input type="range" id="f_admin_price" min="0" value="0" oninput="updateAdminPriceLabel()" onchange="filterAdminTours()" class="w-full cursor-pointer touch-none"></div>
                <div><label class="block text-sm font-semibold text-gray-600 mb-1">Termín od</label><input type="date" id="f_admin_dateFrom" onchange="filterAdminTours()" class="w-full border-2 p-2 rounded outline-none focus:border-blue-500"></div>
                <div><label class="block text-sm font-semibold text-gray-600 mb-1">Termín do</label><input type="date" id="f_admin_dateTo" onchange="filterAdminTours()" class="w-full border-2 p-2 rounded outline-none focus:border-blue-500"></div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-xl overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="border-b-2 border-gray-200 bg-gray-50 text-gray-600">
                        <tr><th class="p-3">Obr.</th><th class="p-3">Název</th><th class="p-3">Země</th><th class="p-3">Od - Do</th><th class="p-3">Cena</th><th class="p-3 text-right">Akce</th></tr>
                    </thead>
                    <tbody id="table"></tbody>
                </table>
            </div>
        </div>

        <div id="view-reservations" class="hidden space-y-8">
            <div class="bg-white p-6 rounded-xl shadow-xl overflow-x-auto">
                <h2 class="text-2xl font-bold mb-4 text-gray-800">Přehled provedených rezervací</h2>
                <table class="w-full text-left border-collapse">
                    <thead class="border-b-2 border-gray-200 bg-gray-50 text-gray-600">
                        <tr><th class="p-3">Zájezd</th><th class="p-3">Země</th><th class="p-3">Klient</th><th class="p-3">Kontakt</th><th class="p-3 text-right">Datum rez.</th></tr>
                    </thead>
                    <tbody id="reservations-table"></tbody>
                </table>
            </div>
        </div>

        <div id="chartsContainer" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8 mt-8">
            <div class="bg-white p-8 rounded-xl shadow-xl"><canvas id="chartCount"></canvas></div>
            <div class="bg-white p-8 rounded-xl shadow-xl"><canvas id="chartValue"></canvas></div>
        </div>
    </div>

    <script>
        let chartCountInstance = null, chartValueInstance = null;
        let cachedTours = [];
        let cachedReservations = [];
        let editingId = null;

        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleDateString('cs-CZ');
        };

        function switchView(view) {
            if(view === 'tours') {
                document.getElementById('view-tours').classList.remove('hidden');
                document.getElementById('view-reservations').classList.add('hidden');
            } else {
                document.getElementById('view-tours').classList.add('hidden');
                document.getElementById('view-reservations').classList.remove('hidden');
                renderReservationsTable();
            }
        }

        async function loadCountries() {
            const res = await fetch('https://restcountries.com/v3.1/all?fields=translations');
            const data = await res.json();
            const countryNames = data.map(c => c.translations.ces?.common).filter(Boolean).sort();
            document.getElementById('countries').innerHTML = countryNames.map(c => `<option value="${c}">`).join('');
        }
        loadCountries();

        async function login() {
            const pwd = document.getElementById('pwd').value;
            const res = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
            if(res.ok) {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('admin').classList.remove('hidden');
                loadData();
            } else { alert('Nesprávné heslo'); }
        }

        function toggleCharts() { document.getElementById('chartsContainer').classList.toggle('hidden'); }

        function updateAdminPriceLabel() {
            document.getElementById('admin_price_val').innerText = document.getElementById('f_admin_price').value + ' Kč';
        }

        async function loadData() {
            const [toursRes, resRes] = await Promise.all([fetch('/api/tours'), fetch('/api/reservations')]);
            cachedTours = await toursRes.json();
            cachedReservations = await resRes.json();
            
            const dests = [...new Set(cachedTours.map(t => t.country))].filter(Boolean).sort();
            document.getElementById('f_admin_country').innerHTML = '<option value="">Všechny destinace</option>' + dests.map(d => `<option value="${d}">${d}</option>`).join('');
            
            const maxPrice = cachedTours.length ? Math.max(...cachedTours.map(t => Number(t.price) || 0)) : 10000;
            const priceInput = document.getElementById('f_admin_price');
            priceInput.max = maxPrice;
            priceInput.value = maxPrice;
            updateAdminPriceLabel();

            renderTable(cachedTours);
            renderCharts(cachedReservations);
        }

        function renderTable(tours) {
            const container = document.getElementById('table');
            if(tours.length === 0) {
                container.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-500">Zadaným kritériím neodpovídá žádný zájezd.</td></tr>';
                return;
            }
            container.innerHTML = tours.map(t => `
                <tr class="border-b border-gray-100 hover:bg-blue-50 transition">
                    <td class="p-3">${t.image ? `<img src="${t.image}" class="w-12 h-12 object-cover rounded shadow">` : `<div class="w-12 h-12 bg-gray-200 rounded flex items-center justify-center text-xs text-gray-500">Bez</div>`}</td>
                    <td class="p-3 font-semibold text-gray-800">${t.name}</td>
                    <td class="p-3 text-gray-600">${t.country}</td>
                    <td class="p-3 text-gray-600 whitespace-nowrap">${formatDate(t.startDate)} <br> ${formatDate(t.endDate)}</td>
                    <td class="p-3 font-bold text-gray-900">${t.price} Kč</td>
                    <td class="p-3 text-right space-x-3">
                        <button onclick="editTour('${t.id}')" class="text-blue-600 font-bold hover:text-blue-800 transition">Upravit</button>
                        <button onclick="delTour('${t.id}')" class="text-red-600 font-bold hover:text-red-800 transition">Smazat</button>
                    </td>
                </tr>`).join('');
        }

        function renderReservationsTable() {
            const container = document.getElementById('reservations-table');
            if(cachedReservations.length === 0) {
                container.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">Zatím nebyly provedeny žádné rezervace.</td></tr>';
                return;
            }
            container.innerHTML = cachedReservations.map(r => `
                <tr class="border-b border-gray-100 hover:bg-green-50 transition">
                    <td class="p-3 font-semibold">${r.tourName}</td>
                    <td class="p-3 text-gray-600">${r.country}</td>
                    <td class="p-3">${r.firstName} ${r.lastName}</td>
                    <td class="p-3 text-sm text-gray-600">${r.email}<br>${r.phone}</td>
                    <td class="p-3 text-right text-gray-500 text-sm">${formatDate(r.date)}</td>
                </tr>`).join('');
        }

        async function saveTour() {
            const fileInput = document.getElementById('t_image');
            let imageBase64 = editingId ? cachedTours.find(x => x.id === editingId).image : null;

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                imageBase64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            const data = {
                name: document.getElementById('t_name').value,
                description: document.getElementById('t_desc').value,
                price: document.getElementById('t_price').value,
                startDate: document.getElementById('t_startDate').value,
                endDate: document.getElementById('t_endDate').value,
                country: document.getElementById('t_country').value,
                image: imageBase64
            };
            
            if(!data.name || !data.startDate || !data.endDate || !data.country) return alert('Vyplňte název, obě data a zemi.');
            
            if (editingId) {
                await fetch('/api/tours', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({id: editingId, ...data}) });
            } else {
                await fetch('/api/tours', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
            }
            cancelEdit();
            loadData();
        }

        function editTour(id) {
            const tour = cachedTours.find(t => t.id === id);
            if(!tour) return;
            document.getElementById('t_name').value = tour.name || '';
            document.getElementById('t_desc').value = tour.description || '';
            document.getElementById('t_price').value = tour.price || '';
            document.getElementById('t_startDate').value = tour.startDate || '';
            document.getElementById('t_endDate').value = tour.endDate || '';
            document.getElementById('t_country').value = tour.country || '';
            document.getElementById('t_image').value = ''; 
            
            editingId = id;
            document.getElementById('submitBtn').innerText = 'Uložit změny';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
        }

        function cancelEdit() {
            editingId = null;
            ['t_name', 't_desc', 't_price', 't_startDate', 't_endDate', 't_country', 't_image'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('submitBtn').innerText = 'Přidat zájezd';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        async function delTour(id) {
            if(confirm('Opravdu smazat zájezd?')) {
                await fetch(`/api/tours?id=${id}`, { method: 'DELETE' });
                loadData();
            }
        }

        function exportCSV() {
            if (cachedReservations.length === 0) return alert('Zatím nejsou žádné rezervace.');
            let csv = '"ID","Zajezd","Zeme","Cena","Jmeno","Prijmeni","Email","Telefon","DatumVytvoreni"\n';
            cachedReservations.forEach(r => {
                const clean = (val) => val ? val.toString().replace(/"/g, '""') : '';
                csv += `"${clean(r.id)}","${clean(r.tourName)}","${clean(r.country)}","${clean(r.price)}","${clean(r.firstName)}","${clean(r.lastName)}","${clean(r.email)}","${clean(r.phone)}","${clean(formatDate(r.date))}"\n`;
            });
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = 'rezervace.csv';
            link.click();
        }

        function renderCharts(reservations) {
            const dataMap = {};
            reservations.forEach(r => {
                if(!dataMap[r.country]) dataMap[r.country] = { count: 0, value: 0 };
                dataMap[r.country].count += 1;
                dataMap[r.country].value += Number(r.price);
            });

            let sortedData = Object.entries(dataMap).map(([country, data]) => ({ country, ...data })).sort((a, b) => b.count - a.count);
            const MAX_SLICES = 7;
            let finalData = sortedData.slice(0, MAX_SLICES);
            const others = sortedData.slice(MAX_SLICES);

            if (others.length > 0) {
                const othersSum = others.reduce((acc, curr) => ({ count: acc.count + curr.count, value: acc.value + curr.value }), { count: 0, value: 0 });
                finalData.push({ country: 'Ostatní', count: othersSum.count, value: othersSum.value });
            }

            const labels = finalData.map(d => d.country);
            const counts = finalData.map(d => d.count);
            const values = finalData.map(d => d.value);

            if(chartCountInstance) chartCountInstance.destroy();
            if(chartValueInstance) chartValueInstance.destroy();

            chartCountInstance = new Chart(document.getElementById('chartCount'), {
                type: 'pie', data: { labels, datasets: [{ label: 'Počet rezervací', data: counts }] },
                options: { plugins: { title: { display: true, text: 'Oblíbenost destinací (Top 7 + Ostatní)' } } }
            });
            chartValueInstance = new Chart(document.getElementById('chartValue'), {
                type: 'bar', data: { labels, datasets: [{ label: 'Tržby (Kč)', data: values, backgroundColor: '#2563eb' }] },
                options: { plugins: { title: { display: true, text: 'Tržby podle destinací (Top 7 + Ostatní)' } } }
            });
        }
    </script>
</body>
</html>
