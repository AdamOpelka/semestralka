<!DOCTYPE html>
<html lang="cs">
<head><meta charset="UTF-8"><title>Admin</title></head>
<body>
    <h1>Administrace (Create, Read, Update, Delete)</h1>
    <input id="pwd" type="password" placeholder="Heslo (heslo123)">
    <button onclick="login()">Přihlásit</button>
    
    <div id="admin" style="display:none; margin-top:20px;">
        <input id="newName" placeholder="Nová položka"><button onclick="create()">Přidat</button>
        <table border="1" id="table" style="margin-top:20px; width:100%;"></table>
    </div>

    <script>
        function login() {
            if(document.getElementById('pwd').value === 'heslo123') {
                document.getElementById('admin').style.display = 'block';
                load();
            }
        }
        async function load() {
            const res = await fetch('/api/items');
            const data = await res.json();
            document.getElementById('table').innerHTML = data.map(i => `
                <tr>
                    <td>${i.name}</td>
                    <td><input id="u_${i.id}" value="${i.name}"></td>
                    <td><button onclick="upd('${i.id}')">Update</button></td>
                    <td><button onclick="del('${i.id}')">Delete</button></td>
                </tr>`).join('');
        }
        async function create() {
            const name = document.getElementById('newName').value;
            await fetch('/api/items', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name}) });
            load();
        }
        async function upd(id) {
            const name = document.getElementById(`u_${id}`).value;
            await fetch('/api/items', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({id, name}) });
            load();
        }
        async function del(id) {
            await fetch(`/api/items?id=${id}`, { method: 'DELETE' });
            load();
        }
    </script>
</body>
</html>
